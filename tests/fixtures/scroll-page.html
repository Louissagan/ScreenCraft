<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ScreenCraft 本地滚动验收样本</title>
<style>*{box-sizing:border-box}body{margin:0;font:18px/1.6 "Microsoft YaHei UI",sans-serif;background:#eef2f7;color:#203047}header{position:sticky;top:0;z-index:3;background:#153759;color:white;padding:18px 30px;border-bottom:5px solid #e5a23a}main{display:flex;max-width:1080px;margin:auto;gap:20px;padding:25px}aside{width:180px;flex:none;align-self:flex-start;position:sticky;top:120px;background:#fff;padding:16px;border:2px solid #9aaabf}article{flex:1;min-width:0}section{background:white;margin-bottom:24px;padding:25px;border-left:8px solid #217787;min-height:220px}section:nth-child(3n){border-color:#cf7a21}section:nth-child(3n+1){border-color:#8554a2}h2{margin:0 0 20px}code{padding:4px;background:#eef2f7}#badge{position:fixed;right:35px;bottom:25px;background:#ffdb64;padding:16px;border:2px solid #493e11;z-index:4}footer{padding:35px;background:#153759;color:white}</style>
<header>ScreenCraft 滚动截图样本 · 固定顶部导航 · 本地文件，不请求外网</header>
<main><aside>Sticky sidebar<br>固定侧栏<br><br>请在 Chrome / Edge 中手动设置 125% 缩放，框选滚动区域。<br><br>本文件尚未进行真实 GUI 验收。</aside><article id="page"></article></main>
<div id="badge">动态浮层 <span id="counter">0</span></div><footer>结束标记 END OF PAGE 048 · 检查是否漏尾部</footer>
<script>for(let n=1;n<=48;n++){let s=document.createElement('section');s.innerHTML='<h2>段落 '+String(n).padStart(3,'0')+' / 048</h2><p>建筑平面 · Section '+n+' · Alpha '+(1000+n)+'</p><p>逐段对照编号、页眉是否重复、正文接缝与底部结束标记。</p><code>ROW-'+n+' / '+(n*7919)+'</code>';document.getElementById('page').append(s)}let count=0;setInterval(()=>document.getElementById('counter').textContent=++count,700)</script></html>
